name: Build

# Every push / pull request: build the DLL (download it from the run's "Artifacts").
# Releases are created by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # the project targets the VS 2026 toolset (v145); the hosted runner has VS 2022 (v143)
      - name: Build Release x64
        shell: pwsh
        run: |
          msbuild "Lift Axle Extension/Lift Axle Extension.vcxproj" /m /nologo /verbosity:minimal `
            /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143

      - name: Package
        shell: pwsh
        run: |
          $dll = "Lift Axle Extension/x64/Release/Lift Axle Extension.dll"
          if (-not (Test-Path $dll)) { throw "DLL not found: $dll" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $dll "dist/LiftAxleExtension.dll"
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md dist/
          Compress-Archive -Path dist/* -DestinationPath LiftAxleExtension.zip -Force
          Get-FileHash dist/LiftAxleExtension.dll -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: LiftAxleExtension
          path: dist/
